name: Build Windows app

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build MomoMemo.sln -c Release

      - name: Publish
        run: dotnet publish MomoMemo.Windows/MomoMemo.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/windows

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows/* -DestinationPath artifacts/Momo-Memo-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Momo-Memo-Windows-x64
          path: artifacts/Momo-Memo-Windows-x64.zip
