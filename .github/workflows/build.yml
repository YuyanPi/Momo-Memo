name: Build macOS app

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: zsh ./scripts/build-macos.sh

      - name: Package app
        run: |
          cd artifacts/macos
          ditto -c -k --keepParent "Momo Memo.app" "Momo-Memo-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momo-Memo-macOS
          path: artifacts/macos/Momo-Memo-macOS.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Momo Memo ${{ github.ref_name }}
          body: |
            Momo Memo macOS 初始版本。

            - 原生 macOS 任务便利贴
            - 支持项目、标签、子任务、提醒、统计与本周导出
            - 下载 `Momo-Memo-macOS.zip`，解压后运行 `Momo Memo.app`
          files: artifacts/macos/Momo-Memo-macOS.zip
